name: 🦞 AIMAG Daily AI News Auto-Update

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00 전날)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # GitHub UI에서 수동 실행 버튼 활성화

jobs:
  update-news:
    name: Fetch & Deploy Latest AI News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. 저장소 체크아웃
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python 환경 설정
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 의존성 설치 (표준 라이브러리만 사용 — 추가 설치 불필요)
      - name: 📦 Verify Python Environment
        run: |
          python --version
          echo "✅ 표준 라이브러리만 사용하므로 추가 패키지 설치 불필요"

      # ── 4. 뉴스 업데이트 스크립트 실행
      - name: 🌐 Run AI News Auto-Update Script
        run: python update_news.py
        env:
          TZ: Asia/Seoul

      # ── 5. 변경 사항 확인
      - name: 🔍 Check for Changes
        id: check_changes
        run: |
          git diff --name-only
          if git diff --quiet ai-app.js index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  변경 사항 없음"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 업데이트 감지됨!"
          fi

      # ── 6. 변경 사항을 GitHub에 커밋 & 푸시
      - name: 📤 Commit & Push Updated News
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name 'AIMAG News Bot 🦞'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ai-app.js index.html
          git commit -m "🤖 Auto Update: AI News for $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. 결과 요약 출력
      - name: 📋 Update Summary
        run: |
          echo "======================================"
          echo "🦞 AIMAG Daily Update Complete!"
          echo "Date: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          echo "Status: ${{ steps.check_changes.outputs.changed == 'true' && '✅ Updated & Deployed' || 'ℹ️  No changes' }}"
          echo "======================================"
